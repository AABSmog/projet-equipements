---
server:
    port: ${PORT:18080}
    compression:
        enabled: true
        min-response-size: 1024
        mime-types: text/html,text/css,text/plain,application/javascript,application/json
    servlet:
        session:
            timeout: 30m
            cookie:
                http-only: true
                same-site: lax
info:
    app:
        name: '@info.app.name@'
        version: '@info.app.version@'
        grailsVersion: '@info.app.grailsVersion@'
grails:
    codegen:
        defaultPackage: proj.equipment
    profile: web

---
grails:
    mime:
        types:
            all: '*/*'
            atom: application/atom+xml
            css: text/css
            csv: text/csv
            form: application/x-www-form-urlencoded
            html:
              - text/html
              - application/xhtml+xml
            js: text/javascript
            json:
              - application/json
              - text/json
            multipartForm: multipart/form-data
            pdf: application/pdf
            rss: application/rss+xml
            text: text/plain
            hal:
              - application/hal+json
              - application/hal+xml
            xml:
              - text/xml
              - application/xml
    views:
        gsp:
            encoding: UTF-8
            htmlcodec: xml
            codecs:
                scriptlet: html

---
dataSource:
    pooled: true
    driverClassName: org.postgresql.Driver
    username: ${EQUIPMENTS_DB_USER:postgres}
    password: ${EQUIPMENTS_DB_PASSWORD}
    dbCreate: update
    url: ${EQUIPMENTS_DB_URL:jdbc:postgresql://localhost:5432/Equipments}
    logSql: false
    hikari:
        maximumPoolSize: ${EQUIPMENTS_DB_POOL_MAX:10}
        minimumIdle: ${EQUIPMENTS_DB_POOL_MIN:2}
        connectionTimeout: 30000
        idleTimeout: 600000
        maxLifetime: 1800000

management:
    endpoints:
        web:
            exposure:
                include: health, info
    endpoint:
        health:
            show-details: never
            probes:
                enabled: true

hibernate:
    cache:
        queries: false
        use_second_level_cache: false
        use_query_cache: false
    dialect: org.hibernate.dialect.PostgreSQLDialect

# Identifiants du jeu de donnees de demonstration (developpement uniquement).
# La valeur par defaut est un mot de passe de demonstration volontairement public ;
# elle est surchargeable par les variables d'environnement DEMO_ADMIN_PASSWORD
# et DEMO_USER_PASSWORD.
demo:
    adminPassword: ${DEMO_ADMIN_PASSWORD:Admin123}
    userPassword: ${DEMO_USER_PASSWORD:User1234}

security:
    login:
        maxAttempts: ${SECURITY_LOGIN_MAX_ATTEMPTS:5}
        windowSeconds: ${SECURITY_LOGIN_WINDOW:900}
        lockDurationSeconds: ${SECURITY_LOGIN_LOCK_DURATION:300}
    register:
        maxPerWindow: ${SECURITY_REGISTER_MAX:3}
        windowSeconds: ${SECURITY_REGISTER_WINDOW:3600}
