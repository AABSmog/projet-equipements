<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Dashboard - Gestion Equipements</title>
    <link rel="stylesheet" href="/css/tailwind.css"/>
</head>
<body data-admin="1" data-active="/admin/ind" class="bg-gray-50 font-sans antialiased">
    <div id="layout-root" class="flex h-screen overflow-hidden" style="display:none">
        <div id="app-nav"></div>
        <main class="flex-1 overflow-y-auto">
            <div class="px-6 pt-5"><div id="flash-container"></div></div>
            <div class="p-6">
                <h1 class="text-xl font-bold text-gray-900 mb-6">Dashboard</h1>
                <div class="grid grid-cols-4 gap-4">
                    <div class="bg-white border border-gray-200 p-5">
                        <div id="stat-equipements" class="text-3xl font-bold text-gray-900">-</div>
                        <div class="text-sm text-gray-500 mt-1">Equipements</div>
                    </div>
                    <div class="bg-white border border-gray-200 p-5">
                        <div id="stat-affectations" class="text-3xl font-bold text-gray-900">-</div>
                        <div class="text-sm text-gray-500 mt-1">Affectations en cours</div>
                    </div>
                    <div class="bg-white border border-gray-200 p-5">
                        <div id="stat-signalements" class="text-3xl font-bold text-gray-900">-</div>
                        <div class="text-sm text-gray-500 mt-1">Signalements</div>
                    </div>
                    <div class="bg-white border border-gray-200 p-5">
                        <div id="stat-personnel" class="text-3xl font-bold text-gray-900">-</div>
                        <div class="text-sm text-gray-500 mt-1">Personnel</div>
                    </div>
                </div>
                <div class="mt-8 grid grid-cols-2 gap-4">
                    <a href="/admin/equipements.html" class="bg-white border border-gray-200 p-5 hover:border-gray-400 transition-colors">
                        <div class="text-sm font-semibold text-gray-900">Gerer les equipements</div>
                        <div class="text-xs text-gray-500 mt-1">Ajouter, modifier, supprimer</div>
                    </a>
                    <a href="/admin/affectations.html" class="bg-white border border-gray-200 p-5 hover:border-gray-400 transition-colors">
                        <div class="text-sm font-semibold text-gray-900">Voir les affectations</div>
                        <div class="text-xs text-gray-500 mt-1">Suivi des equipements affectes</div>
                    </a>
                    <a href="/admin/signalements.html" class="bg-white border border-gray-200 p-5 hover:border-gray-400 transition-colors">
                        <div class="text-sm font-semibold text-gray-900">Voir les signalements</div>
                        <div class="text-xs text-gray-500 mt-1">Problemes rapportes</div>
                    </a>
                    <a href="/admin/personnels.html" class="bg-white border border-gray-200 p-5 hover:border-gray-400 transition-colors">
                        <div class="text-sm font-semibold text-gray-900">Gerer le personnel</div>
                        <div class="text-xs text-gray-500 mt-1">Ajouter, modifier les utilisateurs</div>
                    </a>
                </div>
            </div>
        </main>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/pages/admin-dashboard.js"></script>
</body>
</html>
