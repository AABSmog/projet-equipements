<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Affectations - Gestion Equipements</title>
    <link rel="stylesheet" href="/css/tailwind.css"/>
</head>
<body data-admin="1" data-active="/admin/affect" class="bg-gray-50 font-sans antialiased">
    <div id="layout-root" class="flex h-screen overflow-hidden" style="display:none">
        <div id="app-nav"></div>
        <main class="flex-1 overflow-y-auto">
            <div class="px-6 pt-5"><div id="flash-container"></div></div>
            <div class="p-6">
                <h1 class="text-xl font-bold text-gray-900 mb-4">Affectations</h1>

                <div class="bg-white border border-gray-200 px-3 py-2 mb-6">
                    <h2 class="text-xs font-semibold text-gray-700 mb-2">Nouvelle affectation</h2>
                    <div id="affect-error" class="hidden bg-red-100 border border-red-300 text-red-800 px-4 py-3 text-sm mb-4"></div>
                    <form id="affecter-form" class="flex gap-2 items-end">
                        <div class="flex-1">
                            <label class="block text-xs text-gray-500 mb-0.5" for="eqType">Type (filtre)</label>
                            <select id="eqType" class="w-full px-2 py-1.5 border border-gray-300 text-xs focus:outline-none focus:border-gray-600">
                                <option value="">Tous les types</option>
                            </select>
                        </div>
                        <div class="flex-1">
                            <label class="block text-xs text-gray-500 mb-0.5">Equipement</label>
                            <div>
                                <input type="text" id="eqInput" placeholder="Tapez pour rechercher (type, N serie)..." autocomplete="off"
                                       class="w-full px-2 py-1.5 border border-gray-300 text-xs focus:outline-none focus:border-gray-600"/>
                                <div id="eqMenu" class="hidden border border-gray-300 bg-white shadow text-xs max-h-40 overflow-y-auto">
                                    <div class="px-2 py-1.5 text-gray-400">Recherche...</div>
                                </div>
                                <input type="hidden" id="eqId"/>
                            </div>
                        </div>
                        <div class="flex-1">
                            <label class="block text-xs text-gray-500 mb-0.5">Personnel</label>
                            <div>
                                <input type="text" id="persInput" placeholder="Tapez pour rechercher (nom, prenom)..." autocomplete="off"
                                       class="w-full px-2 py-1.5 border border-gray-300 text-xs focus:outline-none focus:border-gray-600"/>
                                <div id="persMenu" class="hidden border border-gray-300 bg-white shadow text-xs max-h-40 overflow-y-auto">
                                    <div class="px-2 py-1.5 text-gray-400">Recherche...</div>
                                </div>
                                <input type="hidden" id="persId"/>
                            </div>
                        </div>
                        <button type="submit" class="px-3 py-1.5 bg-maroon text-white text-xs font-semibold hover:bg-red-900 transition-colors">Affecter</button>
                    </form>
                </div>

                <p class="text-xs text-gray-500">Consultez l'historique des affectations via le menu « Historique des attributions ».</p>
            </div>
        </main>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/pages/admin-affectations.js"></script>
</body>
</html>
