<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Modifier personnel - Gestion Equipements</title>
    <link rel="stylesheet" href="/css/tailwind.css"/>
</head>
<body data-admin="1" data-active="/admin/pers" class="bg-gray-50 font-sans antialiased">
    <div id="layout-root" class="flex h-screen overflow-hidden" style="display:none">
        <div id="app-nav"></div>
        <main class="flex-1 overflow-y-auto">
            <div class="px-6 pt-5"><div id="flash-container"></div></div>
            <div class="p-6">
                <h1 class="text-xl font-bold text-gray-900 mb-6">Modifier personnel</h1>
                <div class="bg-white border border-gray-200 p-6 max-w-lg">
                    <div id="form-error" class="hidden bg-red-100 border border-red-300 text-red-800 px-4 py-3 text-sm mb-4"></div>
                    <form id="personnel-form">
                        <div class="grid grid-cols-2 gap-4 mb-4">
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1" for="nom">Nom <span class="text-red-500">*</span></label>
                                <input type="text" id="nom" required autocomplete="family-name"
                                    class="w-full px-3 py-2 border border-gray-300 text-sm focus:outline-none focus:border-gray-600"/>
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1" for="prenom">Prenom <span class="text-red-500">*</span></label>
                                <input type="text" id="prenom" required autocomplete="given-name"
                                    class="w-full px-3 py-2 border border-gray-300 text-sm focus:outline-none focus:border-gray-600"/>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-semibold text-gray-700 mb-1" for="email">Email <span class="text-red-500">*</span></label>
                            <input type="email" id="email" required autocomplete="email"
                                class="w-full px-3 py-2 border border-gray-300 text-sm focus:outline-none focus:border-gray-600"/>
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-semibold text-gray-700 mb-1" for="motDePasse">Mot de passe (laisser vide pour conserver)</label>
                            <input type="password" id="motDePasse" autocomplete="new-password"
                                class="w-full px-3 py-2 border border-gray-300 text-sm focus:outline-none focus:border-gray-600"/>
                            <p class="text-xs text-gray-500 mt-1">8 caracteres minimum, avec une minuscule, une majuscule et un chiffre.</p>
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-semibold text-gray-700 mb-1" for="role">Role <span class="text-red-500">*</span></label>
                            <select id="role" class="w-full px-3 py-2 border border-gray-300 text-sm focus:outline-none focus:border-gray-600"></select>
                        </div>
                        <div class="flex gap-3">
                            <button type="submit" class="bg-maroon text-white px-4 py-2 text-sm font-semibold hover:bg-red-900 transition-colors">Enregistrer</button>
                            <a href="/admin/personnels.html" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-900 border border-gray-300 hover:border-gray-400 transition-colors">Annuler</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/pages/admin-personnel-form.js"></script>
</body>
</html>
