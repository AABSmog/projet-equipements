<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Regles de gestion - Gestion Equipements</title>
    <link rel="stylesheet" href="/css/tailwind.css"/>
</head>
<body data-admin="1" data-active="/admin/regles" class="bg-gray-50 font-sans antialiased">
    <div id="layout-root" class="flex h-screen overflow-hidden" style="display:none">
        <div id="app-nav"></div>
        <main class="flex-1 overflow-y-auto">
            <div class="px-6 pt-5"><div id="flash-container"></div></div>
            <div class="p-6 max-w-3xl">
                <h1 class="text-xl font-bold text-gray-900 mb-1">Règles de gestion</h1>
                <p class="text-sm text-gray-500 mb-4">Par entreprise : emails, mots de passe, affectations. Modifications immédiates.</p>

                <div class="mb-4 flex gap-2 items-center">
                    <label class="text-sm">Entreprise <select id="etab-select" class="ml-2 px-3 py-1.5 border border-gray-300 text-sm"></select></label>
                </div>

                <div id="form-error" class="hidden"></div>
                <form id="regles-form" class="bg-white border border-gray-200 p-6 space-y-4">
                    <div id="regles-fields" class="space-y-4"></div>
                    <div class="pt-4 flex gap-2">
                        <button type="submit" class="px-4 py-2 bg-gray-800 text-white text-sm font-semibold">Enregistrer</button>
                        <span id="save-status" class="text-xs text-gray-500 self-center"></span>
                    </div>
                </form>

                <div class="mt-6 bg-blue-50 border border-blue-200 p-4 text-xs text-blue-800">
                    <div class="font-semibold mb-1">Apercu email</div>
                    <div class="flex gap-2">
                        <input id="preview-prenom" placeholder="Prenom" class="px-2 py-1 border border-gray-300 text-xs"/>
                        <input id="preview-nom" placeholder="Nom" class="px-2 py-1 border border-gray-300 text-xs"/>
                        <span id="preview-email" class="font-mono text-sm self-center">—</span>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/pages/admin-regles.js"></script>
</body>
</html>
