<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Signaler un probleme - Gestion Equipements</title>
    <link rel="stylesheet" href="/css/tailwind.css"/>
</head>
<body data-admin="0" data-active="/app/sign" class="bg-gray-50 font-sans antialiased">
    <div id="layout-root" class="flex h-screen overflow-hidden" style="display:none">
        <div id="app-nav"></div>
        <main class="flex-1 overflow-y-auto">
            <div class="px-6 pt-5"><div id="flash-container"></div></div>
            <div class="p-6">
                <div class="max-w-lg">
                    <a id="back-link" href="#" class="text-sm text-gray-500 hover:text-gray-700">&larr; Retour</a>
                    <h1 class="text-xl font-bold text-gray-900 mt-2 mb-6">Signaler un probleme</h1>
                    <div id="form-error" class="hidden bg-red-100 border border-red-300 text-red-800 px-4 py-3 text-sm mb-4"></div>
                    <div id="equipement-info" class="bg-white border border-gray-200 p-5 mb-4"></div>
                    <div class="bg-white border border-gray-200 p-6">
                        <form id="signalement-form">
                            <div class="mb-4">
                                <label class="block text-sm font-semibold text-gray-700 mb-1" for="type">Type de probleme</label>
                                <select id="type" class="w-full px-3 py-2 border border-gray-300 text-sm focus:outline-none focus:border-gray-600"></select>
                            </div>
                            <div class="mb-4">
                                <label class="block text-sm font-semibold text-gray-700 mb-1" for="description">Description</label>
                                <textarea id="description" rows="4" required class="w-full px-3 py-2 border border-gray-300 text-sm focus:outline-none focus:border-gray-600"></textarea>
                            </div>
                            <div class="flex gap-3">
                                <button type="submit" class="bg-maroon text-white px-4 py-2 text-sm font-semibold hover:bg-red-900 transition-colors">Envoyer</button>
                                <a id="cancel-link" href="#" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-900 border border-gray-300 hover:border-gray-400 transition-colors">Annuler</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/pages/app-signalement-create.js"></script>
</body>
</html>
