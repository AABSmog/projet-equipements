<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Inscription - Gestion Equipements</title>
    <link rel="stylesheet" href="/css/tailwind.css"/>
</head>
<body data-guest="1" class="bg-gray-900 min-h-screen flex items-center justify-center font-sans antialiased">
    <div class="w-full max-w-sm">
        <div class="mb-8 text-center">
            <h1 class="text-2xl font-bold text-white tracking-wide">GESTION EQUIPEMENTS</h1>
            <p class="text-gray-400 text-sm mt-1">Creez votre compte</p>
        </div>
        <div class="bg-white">
            <form id="register-form" class="p-6">
                <div id="flash-container" class="mb-4"></div>
                <div id="reg-error" class="hidden bg-red-100 border border-red-300 text-red-800 px-4 py-3 text-sm mb-4"></div>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1" for="nom">Nom <span class="text-red-500">*</span></label>
                        <input type="text" name="nom" id="nom" required autocomplete="family-name"
                            class="w-full px-3 py-2 border border-gray-300 text-sm focus:outline-none focus:border-gray-600"/>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1" for="prenom">Prenom <span class="text-red-500">*</span></label>
                        <input type="text" name="prenom" id="prenom" required autocomplete="given-name"
                            class="w-full px-3 py-2 border border-gray-300 text-sm focus:outline-none focus:border-gray-600"/>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-gray-700 mb-1" for="email">Email <span class="text-red-500">*</span></label>
                    <input type="email" name="email" id="email" required autocomplete="email"
                        class="w-full px-3 py-2 border border-gray-300 text-sm focus:outline-none focus:border-gray-600"/>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-gray-700 mb-1" for="password">Mot de passe <span class="text-red-500">*</span></label>
                    <input type="password" name="password" id="password" required autocomplete="new-password"
                        class="w-full px-3 py-2 border border-gray-300 text-sm focus:outline-none focus:border-gray-600"/>
                    <p class="text-xs text-gray-500 mt-1">8 caracteres minimum, avec une minuscule, une majuscule et un chiffre.</p>
                </div>
                <button type="submit"
                    class="w-full py-2.5 bg-maroon text-white text-sm font-semibold hover:bg-red-900 transition-colors">
                    Creer mon compte
                </button>
            </form>
            <div class="border-t border-gray-200 mt-4 pt-4 text-center pb-6">
                <a href="/index.html" class="text-sm text-gray-600 hover:text-gray-900">Deja un compte ? Connectez-vous</a>
            </div>
        </div>
        <p class="text-center text-xs text-gray-500 mt-4">Projet Equipements &copy; 2026</p>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/pages/register.js"></script>
</body>
</html>
