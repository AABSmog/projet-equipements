<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Gestion Equipements - Choisissez votre entreprise</title>
    <link rel="stylesheet" href="/css/tailwind.css"/>
</head>
<body data-guest="1" class="bg-gray-900 min-h-screen flex items-center justify-center font-sans antialiased p-4">
    <div class="w-full max-w-md">
        <div class="mb-8 text-center">
            <h1 class="text-2xl font-bold text-white tracking-wide">GESTION EQUIPEMENTS</h1>
            <p class="text-gray-400 text-sm mt-1">Choisissez votre entreprise pour vous connecter</p>
        </div>

        <!-- Selection entreprise -->
        <div class="bg-white mb-4">
            <div class="p-4 border-b border-gray-200">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Entreprise *</label>
                <div class="flex gap-2">
                    <select id="etab-select" class="flex-1 px-3 py-2 border border-gray-300 text-sm bg-white focus:outline-none focus:border-gray-600">
                        <option value="">Chargement...</option>
                    </select>
                    <a href="/etablissement-wizard.html" class="px-3 py-2 bg-gray-800 text-white text-sm font-semibold hover:bg-gray-700 whitespace-nowrap">+ Créer</a>
                </div>
                <div id="etab-info" class="mt-2 text-xs text-gray-500 hidden"></div>
                <div class="mt-3 p-2 bg-blue-50 border border-blue-200 text-xs text-blue-800 hidden" id="no-etab-msg">
                    Aucune entreprise ? <a href="/etablissement-wizard.html" class="underline font-semibold">Créez la vôtre en 2 minutes</a> — vous serez administrateur.
                </div>
            </div>
        </div>

        <div class="bg-white">
            <form id="login-form" class="p-6">
                <div id="flash-container" class="mb-4"></div>
                <div id="login-error" class="hidden"></div>
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-gray-700 mb-1" for="email">Email</label>
                    <input type="email" name="email" id="email" required autocomplete="username"
                        class="w-full px-3 py-2 border border-gray-300 text-sm focus:outline-none focus:border-gray-600"/>
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-semibold text-gray-700 mb-1" for="password">Mot de passe</label>
                    <input type="password" name="password" id="password" required autocomplete="current-password"
                        class="w-full px-3 py-2 border border-gray-300 text-sm focus:outline-none focus:border-gray-600"/>
                </div>
                <button type="submit" id="login-btn"
                    class="w-full py-2.5 bg-maroon text-white text-sm font-semibold hover:bg-red-900 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    Se connecter
                </button>
                <p class="text-xs text-gray-400 text-center mt-3">Connexion liée à l'entreprise sélectionnée</p>
            </form>
            <div class="border-t border-gray-200 pt-4 text-center pb-6">
                <a href="/register.html" class="text-sm text-gray-600 hover:text-gray-900">Créer un compte employé</a>
                <span class="text-gray-300 mx-2">·</span>
                <a href="/etablissement-wizard.html" class="text-sm text-blue-600 hover:text-blue-800">Créer une entreprise</a>
            </div>
        </div>
        <p class="text-center text-xs text-gray-500 mt-4">Projet Equipements &copy; 2026</p>
    </div>
    <script src="/js/api.js?v=entreprise"></script>
    <script src="/js/ui.js?v=entreprise"></script>
    <script src="/js/pages/login.js?v=entreprise"></script>
</body>
</html>
